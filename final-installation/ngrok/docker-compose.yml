services:
  gateway:
    image: nginx:1.27-alpine
    container_name: whatsapp-public-gateway
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  ngrok:
    image: ngrok/ngrok:latest
    container_name: whatsapp-ngrok
    restart: unless-stopped
    network_mode: host
    depends_on:
      - gateway
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in ngrok/.env}
      NGROK_DOMAIN: ${NGROK_DOMAIN:?Set NGROK_DOMAIN in ngrok/.env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf 'version: 3\nagent:\n  web_addr: 127.0.0.1:4040\n  inspect_db_size: -1\nendpoints:\n  - name: public-gateway\n    url: https://%s\n    upstream:\n      url: http://127.0.0.1:8090\n      protocol: http1\n' "$$NGROK_DOMAIN" > /tmp/ngrok.yml
        exec ngrok start --all --config /tmp/ngrok.yml
