<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Message</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/brand-layout.css}" />
</head>
<body class="app-form-page">
<main class="container py-4 py-md-5">
  <div class="form-shell">
    <div class="card">
        <div class="card-body">
            <div class="form-card-title">
                <span class="form-card-icon"><i class="fas fa-pen-to-square" aria-hidden="true"></i></span>
                <div><h3 class="mb-1">Message details</h3><p class="text-muted mb-0">Prepare content and an optional attachment for approval.</p></div>
            </div>
            <form id="messageForm" th:action="${message.id != null ? '/messages/' + message.id + '/edit' : '/messages'}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input class="form-control" name="title" maxlength="255" th:value="${message.title}" required />
                    <div class="invalid-feedback">Title is required.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Content</label>
                    <textarea class="form-control" name="content" rows="5" maxlength="4000" th:text="${message.content}" required></textarea>
                    <div class="invalid-feedback">Content is required.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Upload file</label>
                    <input class="form-control" type="file" name="files" />
                    <div class="form-text">Select one attachment. Maximum size: 20 MB.</div>
                    <div id="fileError" class="text-danger small mt-1" role="alert"></div>
                </div>
                <button id="saveMessageButton" class="btn btn-primary" type="submit">
                    <span class="save-idle"><i class="fas fa-check me-2" aria-hidden="true"></i>Save message</span>
                    <span class="save-busy d-none">
                        <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Saving…
                    </span>
                </button>
                <a class="btn btn-outline-secondary" href="/dashboard">Cancel</a>
                <div id="savingStatus" class="saving-status d-none" role="status" aria-live="polite">
                    <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                    <span>Record is saving. Please wait and do not close this window.</span>
                </div>
                <div id="saveError" class="alert alert-danger mt-3 d-none" role="alert"></div>
            </form>
        </div>
    </div>
  </div>
</main>
<script>
    const form = document.getElementById('messageForm');
    const fileInput = form.querySelector('input[type="file"]');
    const fileError = document.getElementById('fileError');
    const saveButton = document.getElementById('saveMessageButton');
    const savingStatus = document.getElementById('savingStatus');
    const saveError = document.getElementById('saveError');
    const maxFileSize = 20 * 1024 * 1024;
    let submitting = false;

    function validateFiles() {
        const oversized = Array.from(fileInput.files).find(file => file.size > maxFileSize);
        const message = oversized ? `${oversized.name} is larger than 20 MB.` : '';
        fileInput.setCustomValidity(message);
        fileError.textContent = message;
        return !oversized;
    }

    fileInput.addEventListener('change', validateFiles);
    form.querySelectorAll('[name="title"], [name="content"]').forEach(field => {
        field.addEventListener('input', () => field.setCustomValidity(field.value.trim() ? '' : 'This field is required.'));
    });
    form.addEventListener('submit', async event => {
        event.preventDefault();
        if (submitting) return;

        form.querySelectorAll('[name="title"], [name="content"]').forEach(field => {
            field.setCustomValidity(field.value.trim() ? '' : `${field.name === 'title' ? 'Title' : 'Content'} is required.`);
        });
        validateFiles();
        if (!form.checkValidity()) {
            form.classList.add('was-validated');
            form.reportValidity();
            return;
        }

        submitting = true;
        saveButton.disabled = true;
        saveButton.setAttribute('aria-disabled', 'true');
        saveButton.querySelector('.save-idle').classList.add('d-none');
        saveButton.querySelector('.save-busy').classList.remove('d-none');
        savingStatus.classList.remove('d-none');
        saveError.classList.add('d-none');

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                credentials: 'same-origin',
                redirect: 'follow'
            });
            if (!response.ok) {
                throw new Error(`The server returned status ${response.status}.`);
            }

            // Loading /dashboard in this frame triggers message-window.js in
            // the parent page to close the window and refresh the message list.
            window.location.replace(response.url || '/dashboard');
        } catch (error) {
            submitting = false;
            saveButton.disabled = false;
            saveButton.removeAttribute('aria-disabled');
            saveButton.querySelector('.save-idle').classList.remove('d-none');
            saveButton.querySelector('.save-busy').classList.add('d-none');
            savingStatus.classList.add('d-none');
            saveError.textContent = `Unable to save the record. ${error.message} Please try again.`;
            saveError.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
