<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/brand-layout.css}" />
</head>
<body class="app-form-page">
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card">
                <div class="card-body p-4">
                    <div class="form-card-title">
                        <span class="form-card-icon"><i class="fas fa-lock" aria-hidden="true"></i></span>
                        <div><h3 class="mb-1">Change password</h3><p class="text-muted mb-0">Choose a strong password with at least 8 characters.</p></div>
                    </div>
                    <div class="alert alert-success" th:if="${param.changed}">
                        Password changed successfully.
                    </div>
                    <div class="alert alert-danger" th:if="${param.error != null and param.error[0] == 'current'}">
                        The current password is incorrect.
                    </div>
                    <div class="alert alert-danger" th:if="${param.error != null and param.error[0] == 'mismatch'}">
                        The new passwords do not match.
                    </div>
                    <div class="alert alert-danger" th:if="${param.error != null and param.error[0] == 'length'}">
                        The new password must be at least 8 characters.
                    </div>
                    <form th:action="@{/change-password}" method="post">
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label">Current Password</label>
                            <input id="currentPassword" class="form-control" type="password"
                                   name="currentPassword" autocomplete="current-password" required autofocus />
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">New Password</label>
                            <input id="newPassword" class="form-control" type="password"
                                   name="newPassword" minlength="8" autocomplete="new-password" required />
                        </div>
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">Confirm New Password</label>
                            <input id="confirmPassword" class="form-control" type="password"
                                   name="confirmPassword" minlength="8" autocomplete="new-password" required />
                        </div>
                        <button class="btn btn-primary w-100" type="submit"><i class="fas fa-shield-halved me-2" aria-hidden="true"></i>Update password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
