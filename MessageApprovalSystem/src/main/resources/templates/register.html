<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Accounts</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/dashboard-grid.css}" />
    <link rel="stylesheet" th:href="@{/css/brand-layout.css}" />
    <script defer th:src="@{/js/user-management.js}"></script>
</head>
<body class="app-form-page">
<div class="container py-4">
    <div class="card mb-4">
        <div class="card-body p-4">
            <div class="form-card-title">
                <span class="form-card-icon"><i class="fas fa-user-plus" aria-hidden="true"></i></span>
                <div><h3 class="mb-1">Create account</h3><p class="text-muted mb-0">Add a secure user or administrator account.</p></div>
            </div>
            <div class="alert alert-success" role="alert" th:if="${successMessage}" th:text="${successMessage}"></div>
            <div class="alert alert-danger" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>
            <div class="alert alert-success" th:if="${param.deleted}"
                 th:text="|${param.deleted[0]} account(s) deleted successfully.|"></div>
            <div class="alert alert-danger" th:if="${param.error != null and param.error[0] == 'selection'}">
                Select at least one account.
            </div>
            <form id="createAccountForm" action="/register" method="post" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label" for="username">Username</label>
                    <input id="username" class="form-control" name="username" maxlength="100"
                           th:value="${usernameValue}" required />
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="password">Password</label>
                    <input id="password" class="form-control" type="password" name="password"
                           minlength="8" autocomplete="new-password" required />
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="mobileNumber">WhatsApp Mobile</label>
                    <input id="mobileNumber" class="form-control" name="mobileNumber"
                           inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10"
                           placeholder="9822004153" th:value="${mobileNumberValue}" required />
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="role">Role</label>
                    <select id="role" class="form-select" name="role">
                        <option value="ROLE_USER" th:selected="${roleValue == null or roleValue == 'ROLE_USER'}">User</option>
                        <option value="ROLE_ADMIN" th:selected="${roleValue == 'ROLE_ADMIN'}">Admin</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button id="createAccountButton" class="btn btn-success w-100"><i class="fas fa-plus me-1" aria-hidden="true"></i>Create</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
                <div>
                    <h3 class="mb-1">User Accounts</h3>
                    <p class="text-muted mb-0" th:text="|${users.size()} account(s)|"></p>
                </div>
                <button id="deleteSelectedUsers" type="submit" form="deleteUsersForm"
                        class="btn btn-danger d-none">
                    Delete Selected (<span id="selectedUserCount">0</span>)
                </button>
            </div>

            <form id="deleteUsersForm" action="/users/delete-selected" method="post"
                  onsubmit="return confirm('Delete the selected accounts and all messages they created?');">
                <div class="table-responsive dashboard-grid user-grid">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                        <tr>
                            <th class="selection-column">
                                <input id="selectAllUsers" class="form-check-input" type="checkbox"
                                       aria-label="Select all deletable users" />
                            </th>
                            <th>Username</th>
                            <th>Registered Mobile</th>
                            <th>Role</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td class="selection-column">
                                <input class="form-check-input user-delete-checkbox" type="checkbox"
                                       name="userIds" th:value="${user.id}"
                                       th:disabled="${user.id == currentUser.id}"
                                       th:aria-label="|Select ${user.username}|" />
                            </td>
                            <td>
                                <span th:text="${user.username}"></span>
                                <span th:if="${user.id == currentUser.id}" class="badge bg-secondary ms-2">Current account</span>
                            </td>
                            <td th:text="${user.mobileNumber != null ? user.mobileNumber : 'Not registered'}"></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${user.role == 'ROLE_ADMIN'} ? ' bg-primary' : ' bg-success'"
                                      th:text="${user.role == 'ROLE_ADMIN'} ? 'Admin' : 'User'"></span>
                            </td>
                        </tr>
                        <tr th:if="${users.isEmpty()}">
                            <td colspan="4" class="text-center text-muted py-4">No accounts found.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </form>
            <p class="small text-muted mt-3 mb-0">
                The current account cannot be selected. Deleting an account also deletes messages and attachments created by it.
            </p>
        </div>
    </div>
</div>
</body>
</html>
